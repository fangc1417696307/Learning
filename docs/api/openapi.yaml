openapi: 3.1.0
info:
  title: 个性化资源生成与学习多智能体系统 API
  version: 1.0.0
  summary: 契约先行版本：22 个目标接口 + 2 个练习期遗留接口
  description: '本文件的条款与《接口规范文档 V1.0》（docs/文档/接口规范文档.docx）逐条对应，与《数据库设计说明书 V1.0》共用同一套字段命名。


    **统一响应体**：所有接口（练习期遗留接口除外）返回 `{code, message, data, request_id}`，结构见各接口的响应定义。业务码 1 表示成功，其余见文档 2.1.2 的编码表。


    **鉴权**：除注册、登录与两个练习期接口外，全部要求 `Authorization: Bearer <token>`。


    **当前状态**：22 个目标接口均为设计先行（尚未实现），2 个练习期接口已实现并标了 deprecated。前端可先按本文件起 Mock 联调，后端按契约逐个追平。'
  contact:
    name: 项目组
    url: https://127.0.0.1:8001/docs
  license:
    name: 课程项目内部使用
    identifier: LicenseRef-Proprietary
servers:
- url: http://127.0.0.1:8001
  description: 本地开发（uvicorn，端口 8001）
tags:
- name: 认证
  description: 注册、登录、登出、当前用户
- name: 画像
  description: 七维画像的读取、人工修正与版本历史
- name: 对话
  description: 会话与消息，画像抽取的输入
- name: 资源生成
  description: 异步任务：提交、轮询、读资源
- name: 学习路径
  description: 路径生成、查询与节点推进
- name: 推送与反馈
  description: 推荐列表与行为埋点
- name: 评估与辅导
  description: 加分项：效果评估、多模态答疑
- name: 练习期遗留（待迁移）
  description: 第 7 课的实现，保留以兼容现有代码
security:
- bearerAuth: []
paths:
  /api/v1/auth/register:
    post:
      tags:
      - 认证
      summary: 用户注册
      operationId: registerUser
      description: 创建账号。注册成功返回用户 ID，不签发令牌，需再调登录。注册只写 app_user，不预建画像——画像在首次抽取时惰性创建，否则会为每个新用户留下 7 条空维度记录。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: 注册成功
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                - data
                - request_id
                properties:
                  code:
                    type: integer
                    description: 业务码：1 成功，0 未分类失败，其余见响应编码表
                    example: 1
                  message:
                    type: string
                    description: 给人看的提示语，成功为 ok
                    example: ok
                  data:
                    type: 'null'
                    description: 无返回内容
                  request_id:
                    type: string
                    description: 本次请求的唯一标识，与响应头 X-Request-Id 同值
                    example: a1b2c3d4e5f6
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/auth/login:
    post:
      tags:
      - 认证
      summary: 用户登录
      operationId: login
      description: 校验账号密码并签发 JWT。连续失败 5 次锁定 15 分钟，返回业务码 600。令牌是无状态 JWT，服务端不保存会话。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                - data
                - request_id
                properties:
                  code:
                    type: integer
                    description: 业务码：1 成功，0 未分类失败，其余见响应编码表
                    example: 1
                  message:
                    type: string
                    description: 给人看的提示语，成功为 ok
                    example: ok
                  data:
                    type: object
                    properties:
                      access_token:
                        type: string
                      token_type:
                        type: string
                        example: Bearer
                      expires_in:
                        type: integer
                        description: 有效期，单位秒
                        example: 7200
                      user:
                        $ref: '#/components/schemas/UserBrief'
                    required:
                    - access_token
                    - token_type
                    - expires_in
                    - user
                  request_id:
                    type: string
                    description: 本次请求的唯一标识，与响应头 X-Request-Id 同值
                    example: a1b2c3d4e5f6
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/logout:
    post:
      tags:
      - 认证
      summary: 退出登录
      operationId: logout
      description: 记录登出时间，由客户端丢弃令牌。注意：JWT 无状态，令牌在过期前技术上仍然可用；要立即失效必须引入 jti 吊销表，已列入 V1.1 演进计划。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                - data
                - request_id
                properties:
                  code:
                    type: integer
                    description: 业务码：1 成功，0 未分类失败，其余见响应编码表
                    example: 1
                  message:
                    type: string
                    description: 给人看的提示语，成功为 ok
                    example: ok
                  data:
                    type: 'null'
                    description: 无返回内容
                  request_id:
                    type: string
                    description: 本次请求的唯一标识，与响应头 X-Request-Id 同值
                    example: a1b2c3d4e5f6
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/me:
    get:
      tags:
      - 认证
      summary: 获取当前用户
      operationId: getCurrentUser
      description: 返回当前登录用户信息与画像完整度。前端首屏调一次，用它判断是否已登录、是否要引导用户去建画像。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                - data
                - request_id
                properties:
                  code:
                    type: integer
                    description: 业务码：1 成功，0 未分类失败，其余见响应编码表
                    example: 1
                  message:
                    type: string
                    description: 给人看的提示语，成功为 ok
                    example: ok
                  data:
                    $ref: '#/components/schemas/UserProfile'
                  request_id:
                    type: string
                    description: 本次请求的唯一标识，与响应头 X-Request-Id 同值
                    example: a1b2c3d4e5f6
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/profile:
    get:
      tags:
      - 画像
      summary: 查询画像
      operationId: getProfile
      description: 返回完整画像（含七个维度）。画像不存在时返回 404，前端据此引导用户进入对话。
      parameters:
      - name: with_dimensions
        in: query
        required: false
        description: 是否返回维度明细；false 时只返回摘要与完整度
        schema:
          type: boolean
          default: true
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                - data
                - request_id
                properties:
                  code:
                    type: integer
                    description: 业务码：1 成功，0 未分类失败，其余见响应编码表
                    example: 1
                  message:
                    type: string
                    description: 给人看的提示语，成功为 ok
                    example: ok
                  data:
                    $ref: '#/components/schemas/Profile'
                  request_id:
                    type: string
                    description: 本次请求的唯一标识，与响应头 X-Request-Id 同值
                    example: a1b2c3d4e5f6
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/profile/dimensions/{dimension_code}:
    patch:
      tags:
      - 画像
      summary: 修改单个画像维度
      operationId: updateProfileDimension
      description: 允许用户纠正某个维度的结论。手动修改同样写 profile_history（source=manual），版本 +1。这是「用户可以否掉 AI 判断」的入口。
      parameters:
      - $ref: '#/components/parameters/DimensionCodePath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDimensionRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                - data
                - request_id
                properties:
                  code:
                    type: integer
                    description: 业务码：1 成功，0 未分类失败，其余见响应编码表
                    example: 1
                  message:
                    type: string
                    description: 给人看的提示语，成功为 ok
                    example: ok
                  data:
                    type: object
                    properties:
                      profile_version:
                        type: integer
                        description: 变更后的版本号
                      dimension:
                        $ref: '#/components/schemas/Dimension'
                      updated_at:
                        type: string
                        format: date-time
                    required:
                    - profile_version
                    - dimension
                    - updated_at
                  request_id:
                    type: string
                    description: 本次请求的唯一标识，与响应头 X-Request-Id 同值
                    example: a1b2c3d4e5f6
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/profile/history:
    get:
      tags:
      - 画像
      summary: 查询画像变更历史
      operationId: getProfileHistory
      description: 分页返回版本变更记录。只返回变更摘要，不返回全量 snapshot_json——体积大且列表页用不到。
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                - data
                - request_id
                properties:
                  code:
                    type: integer
                    description: 业务码：1 成功，0 未分类失败，其余见响应编码表
                    example: 1
                  message:
                    type: string
                    description: 给人看的提示语，成功为 ok
                    example: ok
                  data:
                    $ref: '#/components/schemas/HistoryPage'
                  request_id:
                    type: string
                    description: 本次请求的唯一标识，与响应头 X-Request-Id 同值
                    example: a1b2c3d4e5f6
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/conversations:
    post:
      tags:
      - 对话
      summary: 创建会话
      operationId: createConversation
      description: 开启一轮对话。scene 决定后续使用哪套 System Prompt：画像构建要引导式提问，辅导要直接答疑。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConversationRequest'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                - data
                - request_id
                properties:
                  code:
                    type: integer
                    description: 业务码：1 成功，0 未分类失败，其余见响应编码表
                    example: 1
                  message:
                    type: string
                    description: 给人看的提示语，成功为 ok
                    example: ok
                  data:
                    $ref: '#/components/schemas/Conversation'
                  request_id:
                    type: string
                    description: 本次请求的唯一标识，与响应头 X-Request-Id 同值
                    example: a1b2c3d4e5f6
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/conversations/{conversation_id}/messages:
    get:
      tags:
      - 对话
      summary: 查询消息列表
      operationId: listMessages
      description: 按游标分页拉取历史消息。用 before_id 而不是页码：消息会持续追加，offset 翻页在新消息插入后会重复或漏条。
      parameters:
      - $ref: '#/components/parameters/ConversationIdPath'
      - $ref: '#/components/parameters/BeforeId'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                - data
                - request_id
                properties:
                  code:
                    type: integer
                    description: 业务码：1 成功，0 未分类失败，其余见响应编码表
                    example: 1
                  message:
                    type: string
                    description: 给人看的提示语，成功为 ok
                    example: ok
                  data:
                    $ref: '#/components/schemas/MessageList'
                  request_id:
                    type: string
                    description: 本次请求的唯一标识，与响应头 X-Request-Id 同值
                    example: a1b2c3d4e5f6
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
      - 对话
      summary: 发送消息
      operationId: sendMessage
      description: 写入用户消息并返回助手回复。auto_extract=true 时同步抽取画像，整个请求约 3~8 秒；超过 30 秒降级为只回消息、抽取转后台任务。
      parameters:
      - $ref: '#/components/parameters/ConversationIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                - data
                - request_id
                properties:
                  code:
                    type: integer
                    description: 业务码：1 成功，0 未分类失败，其余见响应编码表
                    example: 1
                  message:
                    type: string
                    description: 给人看的提示语，成功为 ok
                    example: ok
                  data:
                    type: object
                    properties:
                      user_message:
                        $ref: '#/components/schemas/Message'
                      assistant_message:
                        $ref: '#/components/schemas/Message'
                      profile_updated:
                        type: boolean
                        description: 本次是否更新了画像
                      profile_version:
                        type:
                        - integer
                        - 'null'
                        description: 未更新为 null
                    required:
                    - user_message
                    - assistant_message
                    - profile_updated
                  request_id:
                    type: string
                    description: 本次请求的唯一标识，与响应头 X-Request-Id 同值
                    example: a1b2c3d4e5f6
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/conversations/{conversation_id}/extract:
    post:
      tags:
      - 对话
      summary: 从对话抽取画像
      operationId: extractProfile
      description: 把会话内容压缩成七个维度的画像并落库。首次调用会创建 student_profile 与 7 条维度；之后只更新有变化的维度，版本 +1 并写一条 profile_history。抽取失败不影响会话本身——消息已经落库了。
      parameters:
      - $ref: '#/components/parameters/ConversationIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtractRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                - data
                - request_id
                properties:
                  code:
                    type: integer
                    description: 业务码：1 成功，0 未分类失败，其余见响应编码表
                    example: 1
                  message:
                    type: string
                    description: 给人看的提示语，成功为 ok
                    example: ok
                  data:
                    type: object
                    properties:
                      profile_version:
                        type: integer
                      dimensions:
                        type: array
                        items:
                          $ref: '#/components/schemas/Dimension'
                      created:
                        type: boolean
                        description: 是否为首次创建画像
                    required:
                    - profile_version
                    - dimensions
                    - created
                  request_id:
                    type: string
                    description: 本次请求的唯一标识，与响应头 X-Request-Id 同值
                    example: a1b2c3d4e5f6
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/resources/tasks:
    post:
      tags:
      - 资源生成
      summary: 创建资源生成任务
      operationId: createResourceTask
      description: 提交生成请求，立即返回 task_id（HTTP 202 表示已受理、结果稍后取）。同一 path_item_id 已有 pending/running 任务时返回 409，避免重复生成烧 token。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '202':
          description: 任务已受理
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                - data
                - request_id
                properties:
                  code:
                    type: integer
                    description: 业务码：1 成功，0 未分类失败，其余见响应编码表
                    example: 1
                  message:
                    type: string
                    description: 给人看的提示语，成功为 ok
                    example: ok
                  data:
                    type: object
                    properties:
                      task_id:
                        type: integer
                      status:
                        $ref: '#/components/schemas/TaskStatus'
                      estimated_seconds:
                        type: integer
                        description: 预估耗时，供前端提示
                    required:
                    - task_id
                    - status
                    - estimated_seconds
                  request_id:
                    type: string
                    description: 本次请求的唯一标识，与响应头 X-Request-Id 同值
                    example: a1b2c3d4e5f6
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/resources/tasks/{task_id}:
    get:
      tags:
      - 资源生成
      summary: 查询任务状态
      operationId: getResourceTask
      description: 轮询任务进度与各智能体执行情况。前端建议 2 秒一次，超过 60 秒降到 5 秒。status=partial 表示部分资源失败，前端应展示已成功的部分而不是整体报错。
      parameters:
      - $ref: '#/components/parameters/TaskIdPath'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                - data
                - request_id
                properties:
                  code:
                    type: integer
                    description: 业务码：1 成功，0 未分类失败，其余见响应编码表
                    example: 1
                  message:
                    type: string
                    description: 给人看的提示语，成功为 ok
                    example: ok
                  data:
                    $ref: '#/components/schemas/TaskStatusView'
                  request_id:
                    type: string
                    description: 本次请求的唯一标识，与响应头 X-Request-Id 同值
                    example: a1b2c3d4e5f6
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/resources:
    get:
      tags:
      - 资源生成
      summary: 查询资源列表
      operationId: listResources
      description: 分页筛选当前用户的资源。knowledge_points 在库里是 JSON 字符串，服务层反序列化成数组再返回，前端不必二次解析。
      parameters:
      - name: resource_type
        in: query
        required: false
        description: 按类型筛选
        schema:
          $ref: '#/components/schemas/ResourceType'
      - name: keyword
        in: query
        required: false
        description: 标题与摘要模糊匹配
        schema:
          type: string
      - name: task_id
        in: query
        required: false
        description: 按生成任务筛选
        schema:
          type: integer
      - name: difficulty
        in: query
        required: false
        description: 难度筛选
        schema:
          $ref: '#/components/schemas/Difficulty'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                - data
                - request_id
                properties:
                  code:
                    type: integer
                    description: 业务码：1 成功，0 未分类失败，其余见响应编码表
                    example: 1
                  message:
                    type: string
                    description: 给人看的提示语，成功为 ok
                    example: ok
                  data:
                    $ref: '#/components/schemas/ResourcePage'
                  request_id:
                    type: string
                    description: 本次请求的唯一标识，与响应头 X-Request-Id 同值
                    example: a1b2c3d4e5f6
