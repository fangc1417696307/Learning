components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 登录接口返回的 access_token，有效期 2 小时
  parameters:
    Page:
      name: page
      in: query
      required: false
      description: 页码，从 1 开始
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      required: false
      description: 每页条数，上限 100
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    BeforeId:
      name: before_id
      in: query
      required: false
      description: 游标：返回 message_id 小于该值的消息；不传取最新
      schema:
        type: integer
    Limit:
      name: limit
      in: query
      required: false
      description: 条数
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    ConversationIdPath:
      name: conversation_id
      in: path
      required: true
      description: 会话 ID
      schema:
        type: integer
    TaskIdPath:
      name: task_id
      in: path
      required: true
      description: 任务 ID
      schema:
        type: integer
    ResourceIdPath:
      name: resource_id
      in: path
      required: true
      description: 资源 ID
      schema:
        type: integer
    ItemIdPath:
      name: item_id
      in: path
      required: true
      description: 路径节点 ID
      schema:
        type: integer
    DimensionCodePath:
      name: dimension_code
      in: path
      required: true
      description: 维度编码
      schema:
        $ref: '#/components/schemas/DimensionCode'
    StudentIdPath:
      name: student_id
      in: path
      required: true
      description: 学生 ID（练习期接口）
      schema:
        type: integer
  responses:
    BadRequest:
      description: 参数错误：字段缺失、类型不符、枚举越界或业务校验不通过
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: 未登录或凭证失效：缺少 Authorization 头、令牌过期或签名无效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: 无权访问：访问了不属于自己的资源
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: 状态冲突：重复提交、任务未结束、已有进行中的路径等
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ServerError:
      description: 服务器内部错误：data 为 null，详情只写在服务端日志
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    ErrorEnvelope:
      type: object
      properties:
        code:
          type: integer
          description: 业务码，非 1
          example: 400
        message:
          type: string
          description: 可直接展示的中文说明
          example: 参数错误
        data:
          type: 'null'
          description: 失败时恒为 null
        request_id:
          type: string
          example: a1b2c3d4e5f6
      required:
      - code
      - message
      - data
      - request_id
      description: 失败响应：data 恒为 null，原因写在 message 与 code 里
    DimensionCode:
      type: string
      enum:
      - D01
      - D02
      - D03
      - D04
      - D05
      - D06
      - D07
      description: 画像维度编码：D01 知识基础、D02 认知风格、D03 易错点、D04 学习目标、D05 学习节奏、D06 兴趣与动机、D07 资源偏好
      example: D01
    Role:
      type: string
      enum:
      - student
      - teacher
      - admin
    ResourceType:
      type: string
      enum:
      - doc
      - mindmap
      - exercise
      - reading
      - code
      - video
      description: 六类资源：讲解文档 / 思维导图 / 练习题 / 拓展阅读 / 代码案例 / 视频动画
    Difficulty:
      type: string
      enum:
      - easy
      - medium
      - hard
    ConversationScene:
      type: string
      enum:
      - profile_build
      - tutoring
      - resource_chat
      description: 会话场景，决定使用哪套 System Prompt
    MessageRole:
      type: string
      enum:
      - user
      - assistant
      - system
    TaskStatus:
      type: string
      enum:
      - pending
      - running
      - succeeded
      - partial
      - failed
      description: partial 表示部分资源失败，前端应展示已成功的部分
    AgentRunStatus:
      type: string
      enum:
      - pending
      - running
      - succeeded
      - failed
      - skipped
    PathItemStatus:
      type: string
      enum:
      - locked
      - todo
      - doing
      - done
      - skipped
    BehaviorAction:
      type: string
      enum:
      - view
      - play
      - complete
      - like
      - skip
      - ask
    RecommendationStrategy:
      type: string
      enum:
      - profile_match
      - weak_point
      - path_next
      - cold_start
    UserBrief:
      type: object
      properties:
        user_id:
          type: integer
          example: 1
        username:
          type: string
          example: '2023010101'
        display_name:
          type: string
          example: 清浅
        role:
          $ref: '#/components/schemas/Role'
        profile_completeness:
          type: number
          description: 画像完整度 0~1
          example: 0.43
      required:
      - user_id
      - username
      - display_name
      - role
      - profile_completeness
    UserProfile:
      type: object
      properties:
        user_id:
          type: integer
        username:
          type: string
        display_name:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        major:
          type:
          - string
          - 'null'
          description: 专业，未填写为 null
        grade:
          type:
          - string
          - 'null'
          description: 年级，未填写为 null
        profile_completeness:
          type: number
          description: 0~1
        profile_version:
          type:
          - integer
          - 'null'
          description: 无画像时为 null
        created_at:
          type: string
          format: date-time
      required:
      - user_id
      - username
      - display_name
      - role
      - profile_completeness
      - created_at
    Dimension:
      type: object
      properties:
        dimension_code:
          $ref: '#/components/schemas/DimensionCode'
        dimension_name:
          type: string
          example: 知识基础
        value_text:
          type: string
          description: 维度结论，可直接展示的自然语言
        value_score:
          type:
          - number
          - 'null'
          description: 0~100，不可量化的维度为 null
        confidence:
          type: number
          description: 0~1，低置信度不参与推荐排序
        evidence_message_id:
          type:
          - integer
          - 'null'
          description: 证据消息 ID，可回溯到具体那句话
        updated_at:
          type: string
          format: date-time
      required:
      - dimension_code
      - dimension_name
      - value_text
      - confidence
      - updated_at
    Profile:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        version:
          type: integer
          description: 每次维度变更 +1
          example: 3
        completeness:
          type: number
          description: 已填维度数 / 7
          example: 0.43
        summary:
          type:
          - string
          - 'null'
          description: 画像摘要，可直接拼进 Prompt
        dimensions:
          type: array
          items:
            $ref: '#/components/schemas/Dimension'
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - user_id
      - version
      - completeness
      - updated_at
    Conversation:
      type: object
      properties:
        conversation_id:
          type: integer
        scene:
          $ref: '#/components/schemas/ConversationScene'
        title:
          type:
          - string
          - 'null'
        status:
          type: string
          enum:
          - active
          - closed
        created_at:
